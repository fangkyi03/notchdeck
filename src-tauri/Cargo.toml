[package]
name = "notchdeck"
version = "0.3.1"
edition = "2021"

[lib]
name = "notchdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2"
tauri-plugin-process = "2"
sys-locale = "0.3"

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-updater = "2"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
# Windows uses the system TLS (schannel), so no C toolchain is needed for ring.
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
windows = { version = "0.58", features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Storage_Streams",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Foundation_Collections",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Globalization",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
